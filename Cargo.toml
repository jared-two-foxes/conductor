[package]
name = "conductor"
version = "0.1.0"
edition = "2024"
description = "Deterministic execution, verification, and review coordinator"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
executor = { git = "https://github.com/jared-two-foxes/executor" }
review-app = { git = "https://github.com/jared-two-foxes/review", rev = "2173356a2a2de1fed89484e4e7784f89eedd8baa" }
review-protocol = { git = "https://github.com/jared-two-foxes/review", rev = "2173356a2a2de1fed89484e4e7784f89eedd8baa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
git2 = { version = "0.20", default-features = false }
tempfile = "3"
